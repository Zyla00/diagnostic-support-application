<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPred - Rejestracja</title>
    {% load django_bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="text-center">
<main class="form-signin-register d-flex align-items-center justify-content-center">
    <div class="form-container">
        <img class="logo" src="{% static 'img/vitalhustle_icon.svg' %}" alt="Icon"
             style="width: 15vw; height: 15vh;">
        <h3 class="h1 mb-3 fw-bold text-primary text-nowrap" style="font-size: 300%">MedPred</h3>
        <h1 class="h3 mb-3 fw-normal">Stwórz nowe konto</h1>
        <form method="post" id="register-form">
    {% csrf_token %}

    <!-- Username -->
    <div class="form-floating">
        <input type="text" id="{{ form.username.id_for_label }}" class="form-control"
               name="{{ form.username.name }}" placeholder="Username">
        <label for="{{ form.username.id_for_label }}">Username</label>
    </div>

    <!-- Email -->
    <div class="form-floating">
        <input type="text" id="{{ form.email.id_for_label }}" class="form-control"
               name="{{ form.email.name }}" placeholder="Email address">
        <label for="{{ form.email.id_for_label }}">Email address</label>
    </div>

    <!-- Password -->
    <div class="form-floating">
        <input type="password" id="{{ form.password1.id_for_label }}" class="form-control"
               name="{{ form.password1.name }}" placeholder="Password">
        <label for="{{ form.password1.id_for_label }}">Password</label>
    </div>

    <!-- Confirm Password -->
    <div class="form-floating">
        <input type="password" id="{{ form.password2.id_for_label }}" class="form-control"
               name="{{ form.password2.name }}" placeholder="Confirm Password">
        <label for="{{ form.password2.id_for_label }}">Confirm Password</label>
    </div>

    <!-- Role -->
    <div class="mt-3 text-start">
        <label class="form-label d-block">Wybierz rolę:</label>
        {% for choice in form.role %}
            <div class="form-check form-check-inline">
                {{ choice.tag }}
                <label class="form-check-label" for="{{ choice.id_for_label }}">{{ choice.choice_label }}</label>
            </div>
        {% endfor %}
        {{ form.role.errors }}
    </div>

    <!-- License Number (hidden by default) -->
    <div id="license-field" class="form-floating mt-3" style="display: none;">
        <input type="text" id="{{ form.license_number.id_for_label }}" class="form-control"
               name="{{ form.license_number.name }}" placeholder="License number">
        <label for="{{ form.license_number.id_for_label }}">Numer licencji</label>
        {{ form.license_number.errors }}
    </div>

    <!-- Submit -->
    <button class="w-100 btn btn-lg btn-signin-register mt-4" type="submit">Rejestracja</button>
</form>

        <p class="mt-3">Masz już konto? <a href="{% url 'login' %}">Logowanie</a></p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
<script src="{% static 'js/utils/alert.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script>
    function toggleLicenseField() {
        const roleInputs = document.querySelectorAll('input[name="role"]');
        const licenseField = document.getElementById("license-field");
        const selected = Array.from(roleInputs).find(input => input.checked);
        licenseField.style.display = (selected && selected.value === "specialist") ? "block" : "none";
    }

    document.addEventListener("DOMContentLoaded", function () {
        const roleInputs = document.querySelectorAll('input[name="role"]');
        roleInputs.forEach(input => input.addEventListener("change", toggleLicenseField));
        toggleLicenseField(); // initialize on load
    });
</script>

<script type="text/javascript">
    window.addEventListener('load', () => {
        window.alertManager = new AlertManager();
        initializeFormListener();
    })
</script>
</body>
</html>
