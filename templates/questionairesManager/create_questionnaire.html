{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto p-6 bg-white rounded shadow">
    <h1 class="text-2xl font-bold mb-4">Utwórz nową ankietę</h1>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nazwa ankiety</label>
            <input type="text" id="name" name="name" required
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex justify-end space-x-2">
            <a href="{% url 'questionairesManager:questionnaire_list' %}"
               class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">Anuluj</a>
            <button type="submit"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                Zapisz
            </button>
        </div>
    </form>
</div>
{% endblock %}
